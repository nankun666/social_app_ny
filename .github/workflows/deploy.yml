name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "16"

      - name: Install dependencies with Yarn
        run: yarn install

      - name: Build project
        run: yarn build

      - name: Deploy to Vercel
        env:
          VERCELE_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -fsSL https://vercel.com/download -o vercel-cli.tar.gz
          tar -xzf vercel-cli.tar.gz
          sudo mv vercel /usr/local/bin
          vercel --token $VERCELE_API_TOKEN --prod  # 部署到 Vercel
